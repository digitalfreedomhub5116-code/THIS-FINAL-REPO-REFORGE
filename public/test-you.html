<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>YouView Test — Dopamine Animations</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #05050a; color: white; font-family: 'Inter', monospace;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    overflow-x: hidden;
  }

  /* ── Test Controls ── */
  .test-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
    background: rgba(10,10,20,0.95); backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(0,212,255,0.2);
    padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  }
  .test-bar .label { font-size: 9px; font-weight: 900; color: #00d4ff; letter-spacing: 0.2em; font-family: monospace; }
  .test-btn {
    background: rgba(0,212,255,0.1); border: 1px solid rgba(0,212,255,0.3);
    color: #00d4ff; font-size: 10px; font-weight: 800; font-family: monospace;
    padding: 5px 12px; border-radius: 8px; cursor: pointer; letter-spacing: 0.1em;
    transition: all 0.2s;
  }
  .test-btn:hover { background: rgba(0,212,255,0.2); transform: scale(1.05); }
  .test-btn:active { transform: scale(0.95); }
  .test-btn.red { border-color: rgba(248,113,113,0.3); color: #f87171; background: rgba(248,113,113,0.1); }
  .test-btn.green { border-color: rgba(74,222,128,0.3); color: #4ade80; background: rgba(74,222,128,0.1); }
  .test-btn.gold { border-color: rgba(250,204,21,0.3); color: #facc15; background: rgba(250,204,21,0.1); }

  .main-content { margin-top: 60px; width: 100%; max-width: 430px; padding-bottom: 100px; }

  /* ── Animations ── */
  @keyframes particle-burst {
    0% { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
  }
  @keyframes shine-sweep {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(300%); }
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.03); }
  }
  @keyframes float-up {
    0% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-30px); }
  }
  @keyframes count-glow {
    0%, 100% { text-shadow: 0 0 30px rgba(0,212,255,0.3); }
    50% { text-shadow: 0 0 60px rgba(0,212,255,0.6), 0 0 100px rgba(0,212,255,0.3); }
  }
  @keyframes slide-up { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes drop-in { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes typewriter-cursor { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
  @keyframes flame-pulse { 0%,100% { filter: drop-shadow(0 0 4px var(--fc)); } 50% { filter: drop-shadow(0 0 10px var(--fc)); } }

  /* ── Banner ── */
  .banner {
    position: relative; width: 100%; height: 160px; border-radius: 0 0 16px 16px;
    overflow: hidden; background: linear-gradient(135deg, #0a1628 0%, #0c0c1a 50%, #1a0a28 100%);
  }
  .banner-grad { position: absolute; bottom: 0; left: 0; right: 0; height: 100px; background: linear-gradient(to top, rgba(5,5,10,0.95), transparent); }
  .banner .name { position: absolute; bottom: 12px; left: 16px; z-index: 10; }
  .banner .name h2 { font-size: 18px; font-weight: 800; text-shadow: 0 2px 12px rgba(0,0,0,0.8); }
  .banner .rank-badge {
    position: absolute; right: 12px; top: 32%; transform: translateY(-50%);
    width: 54px; height: 54px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 22px; font-family: monospace;
    background: radial-gradient(circle, rgba(0,212,255,0.2), transparent);
    border: 2px solid #00d4ff; color: #00d4ff; animation: breathe 3s ease-in-out infinite;
  }

  /* ── Avatar ── */
  .avatar-wrap { display: flex; flex-direction: column; align-items: center; margin-top: -44px; }
  .avatar-btn { position: relative; border: none; background: none; cursor: pointer; animation: drop-in 0.5s ease-out, breathe 4s ease-in-out 0.5s infinite; }
  .avatar {
    width: 88px; height: 88px; border-radius: 50%; border: 3px solid #00d4ff;
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    display: flex; align-items: center; justify-content: center;
    font-size: 36px; box-shadow: 0 0 24px rgba(0,212,255,0.3);
  }
  .cam-badge {
    position: absolute; bottom: 2px; right: 2px; width: 26px; height: 26px;
    border-radius: 50%; background: #00d4ff; display: flex; align-items: center; justify-content: center;
    border: 2px solid #05050a; z-index: 20; box-shadow: 0 2px 8px rgba(0,212,255,0.4);
    font-size: 12px;
  }
  .change-pill {
    margin-top: 6px; background: rgba(0,212,255,0.08); border: 1px solid rgba(0,212,255,0.2);
    border-radius: 20px; padding: 3px 10px; cursor: pointer; display: flex; align-items: center; gap: 4px;
    font-size: 8px; font-weight: 900; color: #00d4ff; font-family: monospace; letter-spacing: 0.1em;
  }

  /* ── Stat Circles ── */
  .stats-row { display: flex; justify-content: center; gap: 8px; padding: 0 8px; margin-top: 20px; }
  .stat-circle { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .stat-circle svg { width: 52px; height: 52px; transform: rotate(-90deg); }
  .stat-circle .lbl { font-size: 9px; font-weight: 800; font-family: monospace; color: #666; letter-spacing: 0.1em; }
  .stat-circle .val { font-size: 10px; font-weight: 900; font-family: monospace; color: #00d4ff; }

  /* ── Forge Score ── */
  .forge-score-wrap { display: flex; flex-direction: column; align-items: center; margin-top: 16px; position: relative; }
  .forge-num {
    font-size: 52px; font-weight: 900; color: #00d4ff; letter-spacing: -0.03em; line-height: 1;
    position: relative;
  }
  .forge-num.counting { animation: count-glow 0.3s ease-in-out infinite; }
  .forge-label { font-size: 8px; font-weight: 800; font-family: monospace; color: #666; letter-spacing: 0.25em; margin-top: 4px; }
  .particles { position: absolute; inset: 0; pointer-events: none; }
  .particle {
    position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; border-radius: 50%;
    background: #00d4ff; box-shadow: 0 0 6px #00d4ff;
    animation: particle-burst 0.7s ease-out forwards;
  }
  .delta-badge {
    position: absolute; top: -4px; right: 10%;
    font-size: 12px; font-weight: 900; font-family: monospace;
    display: flex; align-items: center; gap: 3px;
    animation: float-up 2.5s ease-out forwards;
  }

  /* ── Streak Flame ── */
  .flame-wrap { display: flex; align-items: center; gap: 4px; }
  .flame-icon { animation: flame-pulse 2s ease-in-out infinite; }
  .flame-count { font-size: 9px; font-weight: 900; font-family: monospace; }
  .flame-tier { font-size: 7px; font-weight: 800; font-family: monospace; letter-spacing: 0.15em; opacity: 0.7; margin-top: 1px; }

  /* ── Glass Panel ── */
  .glass-panel {
    margin: 20px 16px 0; padding: 20px 16px 14px; border-radius: 16px; position: relative; overflow: hidden;
    background: linear-gradient(135deg, rgba(0,212,255,0.06), rgba(10,10,20,0.7), rgba(0,212,255,0.04));
    border: 1px solid rgba(0,212,255,0.12);
    box-shadow: inset 0 1px 0 rgba(0,212,255,0.08), 0 8px 32px rgba(0,0,0,0.3);
    animation: slide-up 0.6s ease-out 0.8s both;
  }
  .glass-panel .shine {
    position: absolute; top: 0; left: 0; width: 50%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(0,212,255,0.08), transparent);
    animation: shine-sweep 1.5s ease-out 1.2s forwards;
  }
  .glass-panel .title { font-size: 8px; font-weight: 800; font-family: monospace; color: #666; letter-spacing: 0.2em; text-align: center; margin-bottom: 12px; }

  /* ── Fortune Widget ── */
  .fortune {
    margin: 16px 4px 0; padding: 16px; border-radius: 16px; position: relative; overflow: hidden;
    background: linear-gradient(135deg, rgba(0,212,255,0.04), rgba(10,10,20,0.8), rgba(0,212,255,0.03));
    animation: slide-up 0.5s ease-out 1.5s both;
  }
  .fortune .top-line { position: absolute; top: 0; left: 0; right: 0; height: 1px; }
  .fortune .hdr { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .fortune .hdr .icon { font-size: 14px; }
  .fortune .hdr .lbl { font-size: 8px; font-weight: 900; font-family: monospace; letter-spacing: 0.2em; }
  .fortune .txt { font-size: 11px; font-family: monospace; color: #c0c0c8; line-height: 1.6; min-height: 36px; }
  .fortune .cursor { animation: typewriter-cursor 0.8s ease-in-out infinite; }
</style>
</head>
<body>

<!-- ── Test Controls ── -->
<div class="test-bar">
  <span class="label">TEST CONTROLS</span>
  <button class="test-btn" onclick="replayCounter()">🎰 REPLAY COUNTER</button>
  <button class="test-btn green" onclick="changeStreak()">🔥 CYCLE STREAK</button>
  <button class="test-btn gold" onclick="changeFortune()">🎁 NEW FORTUNE</button>
  <button class="test-btn red" onclick="triggerDelta()">📈 SHOW DELTA</button>
</div>

<!-- ── Main Content ── -->
<div class="main-content">

  <!-- Banner -->
  <div class="banner">
    <div style="width:100%;height:100%;background:linear-gradient(135deg,#0a1628,#1a0a28);display:flex;align-items:center;justify-content:center;">
      <div style="font-size:11px;font-family:monospace;color:rgba(255,255,255,0.15);letter-spacing:0.3em;">BANNER IMAGE</div>
    </div>
    <div class="banner-grad"></div>
    <div class="name">
      <div style="display:flex;align-items:center;gap:8px;">
        <h2 id="playerName">TestHunter</h2>
        <div class="flame-wrap" id="streakFlame" style="display:none;">
          <span class="flame-icon" id="flameIcon">🔥</span>
          <span class="flame-count" id="flameCount">0</span>
        </div>
      </div>
      <div class="flame-tier" id="flameTier" style="display:none;"></div>
    </div>
    <div class="rank-badge">B</div>
  </div>

  <!-- Avatar -->
  <div class="avatar-wrap">
    <button class="avatar-btn">
      <div class="avatar">🧑</div>
      <div class="cam-badge">📷</div>
    </button>
    <div class="change-pill">📷 CHANGE</div>
  </div>

  <!-- Stat Circles -->
  <div class="stats-row" id="statsRow"></div>

  <!-- Forge Score -->
  <div class="forge-score-wrap">
    <div class="forge-num" id="forgeNum">0</div>
    <div class="particles" id="particles"></div>
    <div class="delta-badge" id="deltaBadge" style="display:none;"></div>
    <div class="forge-label">FORGE SCORE</div>
  </div>

  <!-- Glass Panel -->
  <div class="glass-panel">
    <div class="shine"></div>
    <div class="title">POTENTIAL DISTRIBUTION</div>
    <svg width="100%" viewBox="0 0 300 100" id="curveSvg"></svg>
  </div>

  <!-- Daily Fortune -->
  <div class="fortune" id="fortuneCard">
    <div class="top-line" id="fortuneLine"></div>
    <div class="hdr">
      <span class="icon" id="fortuneIcon">⚡</span>
      <span class="lbl" id="fortuneLabel" style="color:#00d4ff;">SYSTEM BROADCAST</span>
      <span style="margin-left:auto;font-size:10px;opacity:0.6;">✨</span>
    </div>
    <div class="txt" id="fortuneText"></div>
  </div>

</div>

<script>
// ── State ──
let forgeScore = 87;
let streakDay = 14;
let lastForge = 82; // simulate previous visit
const STATS = [
  { key: 'STR', value: 45 },
  { key: 'INT', value: 72 },
  { key: 'DIS', value: 90 },
  { key: 'SOC', value: 38 },
  { key: 'FOC', value: 68 },
  { key: 'WIL', value: 55 },
];

// ── Render stat circles ──
function renderStats() {
  const row = document.getElementById('statsRow');
  row.innerHTML = '';
  STATS.forEach((s, i) => {
    const pct = Math.min(100, (s.value / 200) * 100);
    const r = 22, circ = 2 * Math.PI * r;
    const offset = circ - (pct / 100) * circ;
    const color = s.value < 50 ? '#5a9ab0' : s.value < 100 ? '#00d4ff' : '#9ad0e8';
    const el = document.createElement('div');
    el.className = 'stat-circle';
    el.style.opacity = '0';
    el.style.animation = `slide-up 0.4s ease-out ${0.3 + i * 0.08}s forwards`;
    el.innerHTML = `
      <svg viewBox="0 0 52 52">
        <circle cx="26" cy="26" r="${r}" fill="none" stroke="rgba(0,212,255,0.1)" stroke-width="3.5"/>
        <circle cx="26" cy="26" r="${r}" fill="none" stroke="${color}" stroke-width="3.5"
          stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${circ}"
          style="transition: stroke-dashoffset 0.8s ease-out ${0.5 + i * 0.08}s;">
        </circle>
      </svg>
      <div class="lbl">${s.key}</div>
      <div class="val" style="color:${color}">${s.value}</div>
    `;
    row.appendChild(el);
    // Trigger the circle animation
    requestAnimationFrame(() => {
      const circle = el.querySelector('circle:last-child');
      circle.style.strokeDashoffset = offset;
    });
  });
}

// ── Casino Counter ──
function replayCounter() {
  const el = document.getElementById('forgeNum');
  const particlesEl = document.getElementById('particles');
  const deltaEl = document.getElementById('deltaBadge');

  el.classList.add('counting');
  particlesEl.innerHTML = '';
  deltaEl.style.display = 'none';

  let start = null;
  const duration = 1400;

  function step(ts) {
    if (!start) start = ts;
    const p = Math.min(1, (ts - start) / duration);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(eased * forgeScore);
    if (p < 1) {
      requestAnimationFrame(step);
    } else {
      el.classList.remove('counting');
      burstParticles();
      showDelta();
    }
  }
  requestAnimationFrame(step);
}

function burstParticles() {
  const container = document.getElementById('particles');
  container.innerHTML = '';
  for (let i = 0; i < 14; i++) {
    const angle = (i / 14) * Math.PI * 2;
    const dist = 30 + Math.random() * 25;
    const dot = document.createElement('div');
    dot.className = 'particle';
    dot.style.setProperty('--dx', `${Math.cos(angle) * dist}px`);
    dot.style.setProperty('--dy', `${Math.sin(angle) * dist}px`);
    container.appendChild(dot);
  }
}

function showDelta() {
  const delta = forgeScore - lastForge;
  if (delta === 0) return;
  const el = document.getElementById('deltaBadge');
  el.style.display = 'flex';
  el.style.color = delta > 0 ? '#4ade80' : '#f87171';
  el.style.animation = 'none';
  el.offsetHeight; // reflow
  el.style.animation = 'float-up 2.5s ease-out forwards';
  el.innerHTML = `${delta > 0 ? '↑' : '↓'} ${delta > 0 ? '+' : ''}${delta}`;
}

function triggerDelta() {
  lastForge = forgeScore - Math.floor(Math.random() * 15 + 1);
  replayCounter();
}

// ── Streak Flame ──
const flameColors = ['#555', '#ff6b35', '#ff9500', '#ffcc00', '#00d4ff', '#8b5cf6', '#f472b6'];
const flameNames = ['Dead', 'Spark', 'Flame', 'Torch', 'Bonfire', 'Inferno', 'Eternal'];
const streakTiers = [0, 1, 7, 14, 30, 60, 100];

function updateStreak(val) {
  streakDay = val;
  const tier = streakDay === 0 ? 0 : streakDay < 7 ? 1 : streakDay < 14 ? 2 : streakDay < 30 ? 3 : streakDay < 60 ? 4 : streakDay < 100 ? 5 : 6;
  const flameEl = document.getElementById('streakFlame');
  const tierEl = document.getElementById('flameTier');
  const iconEl = document.getElementById('flameIcon');
  const countEl = document.getElementById('flameCount');

  if (streakDay === 0) {
    flameEl.style.display = 'none';
    tierEl.style.display = 'none';
    return;
  }

  flameEl.style.display = 'flex';
  tierEl.style.display = 'block';
  const fc = flameColors[tier];
  iconEl.style.setProperty('--fc', fc);
  iconEl.style.color = fc;
  iconEl.style.fontSize = tier >= 4 ? '18px' : '14px';
  countEl.style.color = fc;
  countEl.textContent = streakDay;
  tierEl.style.color = fc;
  tierEl.textContent = flameNames[tier];
}

let currentTierIdx = 3; // start at Torch (14 days)
function changeStreak() {
  currentTierIdx = (currentTierIdx + 1) % 7;
  const vals = [0, 3, 10, 14, 45, 75, 120];
  updateStreak(vals[currentTierIdx]);
}

// ── Daily Fortune ──
const FORTUNES = [
  { icon: '⚡', label: 'SYSTEM BROADCAST', text: 'The System has observed 14 consecutive days of discipline. You are among the elite hunters who sustain this pace.', accent: '#00d4ff' },
  { icon: '📈', label: 'STAT ANALYSIS', text: 'Your dominant attribute is Discipline (90 pts). This exceeds the average hunter by a significant margin.', accent: '#8b5cf6' },
  { icon: '✨', label: 'FORTUNE BONUS', text: 'The System rewards persistence. Complete today\'s quests and a bonus may appear. Fortune favors the relentless.', accent: '#facc15' },
  { icon: '🗡️', label: 'INTEL REPORT', text: 'Your 14-day streak puts you ahead of most hunters at Level 39. The leaderboard shifts weekly — every point counts.', accent: '#f87171' },
  { icon: '🌟', label: 'RARE SIGNAL', text: 'A faint signal from the System: hidden rewards await hunters who push beyond their comfort zone. The rarest borders are earned, not bought.', accent: '#f472b6' },
];
let fortuneIdx = 0;

function typeFortune(fortune) {
  const txtEl = document.getElementById('fortuneText');
  const iconEl = document.getElementById('fortuneIcon');
  const lblEl = document.getElementById('fortuneLabel');
  const lineEl = document.getElementById('fortuneLine');
  const cardEl = document.getElementById('fortuneCard');

  iconEl.textContent = fortune.icon;
  lblEl.textContent = fortune.label;
  lblEl.style.color = fortune.accent;
  lineEl.style.background = `linear-gradient(90deg, transparent 10%, ${fortune.accent}66 50%, transparent 90%)`;
  cardEl.style.borderColor = fortune.accent + '33';

  txtEl.textContent = '';
  let i = 0;
  const interval = setInterval(() => {
    i += 2;
    txtEl.innerHTML = fortune.text.slice(0, i) + (i < fortune.text.length ? `<span class="cursor" style="color:${fortune.accent}">|</span>` : '');
    if (i >= fortune.text.length) clearInterval(interval);
  }, 25);
}

function changeFortune() {
  fortuneIdx = (fortuneIdx + 1) % FORTUNES.length;
  typeFortune(FORTUNES[fortuneIdx]);
}

// ── Bell Curve ──
function renderCurve() {
  const W = 300, H = 100, pad = 20, bot = 20;
  const curveH = H - bot;
  let pts = [];
  for (let i = 0; i <= 80; i++) {
    const t = i / 80;
    const x = pad + t * (W - pad * 2);
    const g = Math.exp(-0.5 * Math.pow((t - 0.5) / 0.17, 2));
    pts.push(`${x},${curveH - g * (curveH - 10)}`);
  }
  const clamped = Math.max(0, Math.min(200, forgeScore));
  const sT = clamped / 200;
  const sX = pad + sT * (W - pad * 2);
  const sG = Math.exp(-0.5 * Math.pow((sT - 0.5) / 0.17, 2));
  const sY = curveH - sG * (curveH - 10);

  document.getElementById('curveSvg').innerHTML = `
    <defs>
      <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="rgba(0,212,255,0.15)"/><stop offset="100%" stop-color="rgba(0,212,255,0)"/></linearGradient>
      <filter id="glow"><feGaussianBlur stdDeviation="3" result="cb"/><feMerge><feMergeNode in="cb"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <polygon points="${pad},${curveH} ${pts.join(' ')} ${W-pad},${curveH}" fill="url(#fill)"/>
    <polyline points="${pts.join(' ')}" fill="none" stroke="#00d4ff" stroke-width="2" stroke-linejoin="round" filter="url(#glow)"/>
    <line x1="${sX}" y1="${sY}" x2="${sX}" y2="${curveH}" stroke="#00d4ff" stroke-width="1" stroke-dasharray="3 3" opacity="0.4"/>
    <circle cx="${sX}" cy="${sY}" r="4.5" fill="#00d4ff" stroke="#0a0a14" stroke-width="2" filter="url(#glow)"/>
    <circle cx="${sX}" cy="${sY}" r="2" fill="#00d4ff"/>
    <text x="${sX}" y="${sY-10}" text-anchor="middle" fill="#00d4ff" font-size="7" font-weight="800" font-family="monospace">YOU</text>
    <text x="${pad}" y="${H-4}" fill="rgba(255,255,255,0.2)" font-size="7" font-family="monospace">0</text>
    <text x="${W/2}" y="${H-4}" text-anchor="middle" fill="rgba(255,255,255,0.2)" font-size="7" font-family="monospace">100</text>
    <text x="${W-pad}" y="${H-4}" text-anchor="end" fill="rgba(255,255,255,0.2)" font-size="7" font-family="monospace">200</text>
  `;
}

// ── Init ──
renderStats();
updateStreak(14);
renderCurve();
typeFortune(FORTUNES[0]);
setTimeout(replayCounter, 300);
</script>
</body>
</html>
