<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuditTheater Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; font-family: 'JetBrains Mono', 'Inter', monospace; overflow: hidden; }

    .theater {
      position: fixed; inset: 0; z-index: 400;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      background: radial-gradient(circle at 50% 50%, rgba(8,51,68,0.4) 0%, rgba(0,0,0,0.98) 70%, #000 100%);
    }

    .ambient {
      position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse at 50% 40%, rgba(6,182,212,0.15) 0%, transparent 70%);
      animation: ambientPulse 3s ease-in-out infinite;
    }
    @keyframes ambientPulse { 0%, 100% { opacity: 0.03; } 50% { opacity: 0.08; } }

    .scanlines-overlay {
      position: absolute; inset: 0; pointer-events: none; opacity: 0.04;
      background-image: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.2) 2px, rgba(255,255,255,0.2) 3px);
    }

    .card {
      width: 100%; max-width: 420px; position: relative; z-index: 10;
      padding: 24px; border-radius: 12px;
      border: 1px solid rgba(0,212,255,0.5);
      background: rgba(0,40,50,0.2);
      backdrop-filter: blur(12px);
      box-shadow: 0 0 20px rgba(6,182,212,0.3);
    }

    .icon-container {
      position: relative; width: 80px; height: 80px; margin: 0 auto 24px;
      display: flex; align-items: center; justify-content: center;
    }
    .icon-container svg.ring {
      position: absolute; inset: 0; width: 100%; height: 100%;
      transform: rotate(-90deg);
    }
    .icon-container svg.ring circle.track { fill: none; stroke: rgba(6,182,212,0.1); stroke-width: 3; }
    .icon-container svg.ring circle.progress {
      fill: none; stroke: #00d4ff; stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 226.19;  /* 2 * PI * 36 */
      stroke-dashoffset: 226.19;
      animation: irregularFill 3s ease-in-out forwards;
      filter: drop-shadow(0 0 6px rgba(0,212,255,0.7));
    }
    @keyframes irregularFill {
      0%   { stroke-dashoffset: 226.19; }   /* 0%   */
      15%  { stroke-dashoffset: 158.33; }   /* 30%  — quick burst */
      25%  { stroke-dashoffset: 158.33; }   /* 30%  — pause */
      40%  { stroke-dashoffset: 101.79; }   /* 55%  — burst */
      55%  { stroke-dashoffset: 101.79; }   /* 55%  — pause */
      65%  { stroke-dashoffset: 56.55; }    /* 75%  — burst */
      80%  { stroke-dashoffset: 56.55; }    /* 75%  — pause */
      100% { stroke-dashoffset: 0; }        /* 100% — complete */
    }

    .scan-icon {
      color: #00d4ff;
      filter: drop-shadow(0 0 15px rgba(6,182,212,0.6));
    }

    h2 { color: #00d4ff; font-size: 18px; font-weight: 900; letter-spacing: 0.2em; text-align: center; margin-bottom: 8px; text-transform: uppercase; }
    .quest-title { color: #9ca3af; font-size: 12px; letter-spacing: 0.1em; text-align: center; margin-bottom: 32px; max-width: 280px; margin-left: auto; margin-right: auto; line-height: 1.6; }

    .status-box {
      width: 100%; background: rgba(0,0,0,0.5); border-radius: 8px; padding: 12px;
      border: 1px solid rgba(0,80,100,0.5);
      display: flex; align-items: center; justify-content: center; height: 50px;
    }
    .status-text {
      font-size: 10px; color: rgba(51,223,255,0.8); letter-spacing: 0.15em; text-transform: uppercase;
      animation: statusFade 1s ease-in-out infinite alternate;
    }
    @keyframes statusFade { 0% { opacity: 0.5; } 100% { opacity: 1; } }

    /* Scanning Line Loader */
    .scan-loader {
      width: 100%; height: 32px; position: relative; margin-top: 24px;
      overflow: hidden; border-radius: 8px; background: rgba(0,0,0,0.3);
    }
    .scan-grid {
      position: absolute; inset: 0; opacity: 0.08;
      background-image: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,212,255,0.4) 3px, rgba(0,212,255,0.4) 4px);
    }
    .scan-laser-wrapper {
      position: absolute; left: 0; width: 100%; height: 14px; top: 0;
      animation: laserSweep 1.8s ease-in-out infinite;
    }
    @keyframes laserSweep { 0% { transform: translateY(0); } 50% { transform: translateY(18px); } 100% { transform: translateY(0); } }
    .laser-glow-above { width: 100%; height: 6px; background: linear-gradient(to bottom, transparent, rgba(0,212,255,0.2)); }
    .laser-line { width: 100%; height: 2px; background: #00d4ff; box-shadow: 0 0 8px rgba(0,212,255,0.9), 0 0 20px rgba(0,212,255,0.4); }
    .laser-glow-below { width: 100%; height: 6px; background: linear-gradient(to bottom, rgba(0,212,255,0.15), transparent); }

    .corner-tl { position: absolute; top: 16px; left: 16px; font-size: 8px; color: #4b5563; letter-spacing: 0.15em; }
    .corner-br { position: absolute; bottom: 16px; right: 16px; font-size: 8px; color: #4b5563; letter-spacing: 0.15em; text-transform: uppercase; }

    /* Replay button */
    .replay-btn {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 500;
      padding: 10px 24px; border-radius: 8px; font-size: 11px; font-weight: 700;
      font-family: 'JetBrains Mono', monospace; letter-spacing: 0.1em; text-transform: uppercase;
      cursor: pointer; border: 1px solid rgba(0,212,255,0.3); color: #00d4ff; background: rgba(0,212,255,0.06);
      transition: all 0.2s;
    }
    .replay-btn:hover { background: rgba(0,212,255,0.15); border-color: #00d4ff; }
  </style>
</head>
<body>
  <div class="theater">
    <div class="ambient"></div>
    <div class="scanlines-overlay"></div>

    <div class="card">
      <div class="icon-container">
        <svg class="ring" viewBox="0 0 80 80">
          <circle class="track" cx="40" cy="40" r="36" />
          <circle class="progress" cx="40" cy="40" r="36" id="progressCircle" />
        </svg>
        <svg class="scan-icon" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/><path d="M11 8v6"/><path d="M8 11h6"/>
        </svg>
      </div>

      <h2>FORGEGUARD AUDIT</h2>
      <p class="quest-title">Complete 30 minutes of reading</p>

      <div class="status-box">
        <span class="status-text" id="scanText">ANALYZING SESSION DATA...</span>
      </div>

      <div class="scan-loader">
        <div class="scan-grid"></div>
        <div class="scan-laser-wrapper">
          <div class="laser-glow-above"></div>
          <div class="laser-line"></div>
          <div class="laser-glow-below"></div>
        </div>
      </div>
    </div>

    <div class="corner-tl">FORGEGUARD // SCANNING</div>
    <div class="corner-br">RANK: B</div>
  </div>

  <button class="replay-btn" onclick="replay()">↻ REPLAY ANIMATION</button>

  <script>
    const texts = ['ANALYZING SESSION DATA...', 'CROSS-REFERENCING HUNTER RECORD...', 'EVALUATING SUBMISSION INTEGRITY...'];
    let idx = 0;
    setInterval(() => { idx = (idx + 1) % texts.length; document.getElementById('scanText').textContent = texts[idx]; }, 1000);

    function replay() {
      const el = document.getElementById('progressCircle');
      el.style.animation = 'none';
      el.offsetHeight; // force reflow
      el.style.animation = 'irregularFill 3s ease-in-out forwards';
    }
  </script>
</body>
</html>
