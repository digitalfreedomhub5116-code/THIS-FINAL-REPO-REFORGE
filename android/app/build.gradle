apply plugin: 'com.android.application'

// Load keystore credentials from local.properties (not committed to Git)
def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    localProps.load(new FileInputStream(localPropsFile))
}

android {
    namespace = "com.reforge.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.reforge.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2000004
        versionName "20.0.4"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            storeFile file(localProps.getProperty('RELEASE_STORE_FILE', 'reforge-release.keystore'))
            storePassword localProps.getProperty('RELEASE_STORE_PASSWORD', '')
            keyAlias localProps.getProperty('RELEASE_KEY_ALIAS', 'reforge')
            keyPassword localProps.getProperty('RELEASE_KEY_PASSWORD', '')
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Disable the AGP lintVital task for release. With recent AGP + Capacitor,
    // lintVital evicts a build artifact (merged proguard mapping) that
    // packageReleaseBundle then expects, causing
    //   "Expected file collection to contain exactly one file, however, it
    //    contains no files."
    // We don't rely on lintVital for correctness — it's a quality scan, and
    // we run lint manually when needed.
    lint {
        checkReleaseBuilds = false
        abortOnError = false
    }

    // Bundle configuration — force a universal AAB so the packageReleaseBundle
    // task always has a merged JNI lib set to package. Without this, recent AGP
    // versions sometimes fail with "Expected file collection to contain exactly
    // one file" when the lint task evicts split-by-ABI native libs before the
    // bundle task picks them up.
    bundle {
        language { enableSplit = true }
        density  { enableSplit = true }
        abi      { enableSplit = false }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'com.google.android.play:app-update:2.1.0'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
